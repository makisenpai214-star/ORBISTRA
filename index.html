<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMH WORLD MAP</title><meta name="description" content="SMH WORLD MAP — explore the Earth: satellite, terrain, weather, GPS and routes.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#03060f">
<link rel="stylesheet" href="styles.css"></head><body>
<div id="splash"><div id="stars"></div><div class="scene"><div class="orbit"><i></i></div><div class="earth"></div></div><h1 class="gold">SMH WORLD MAP</h1></div>
<main id="auth" hidden><div id="stars2"></div><div class="earth sm"></div><h1 class="gold">SMH WORLD MAP</h1>
 <div class="abox" id="a_home"><button class="btn pri" id="b_login">LOG IN</button><button class="btn" id="b_google">CONTINUE WITH GOOGLE</button><button class="lnk" id="b_guest">Continue as guest</button></div>
 <form class="abox" id="a_form" hidden><input id="a_mail" type="email" placeholder="Email" autocomplete="email" required><input id="a_pass" type="password" placeholder="Password" autocomplete="current-password" minlength="6">
  <button class="btn pri" id="a_go">Log in</button><button type="button" class="lnk" id="a_new">Create account</button><button type="button" class="lnk" id="a_rst">Forgot password?</button><button type="button" class="lnk" id="a_back">← Back</button></form>
 <p id="a_msg" role="status"></p></main>
<div id="app" hidden>
 <div id="map"></div>
 <div id="top"><form id="sf" class="card"><button type="button" class="ib" id="menu" aria-label="Settings">☰</button><input id="q" placeholder="Search places or lat, lng" autocomplete="off" enterkeyhint="search"><button type="button" class="ib" id="mic" aria-label="Voice search">🎤</button></form><div id="sug" class="card" hidden></div></div>
 <div id="side" class="card"><button class="ib" id="zi" aria-label="Zoom in">＋</button><button class="ib" id="zo" aria-label="Zoom out">－</button><button class="ib" id="loc" aria-label="My location">◎</button><button class="ib" id="ly" aria-label="Layers and tools">◫</button><button class="ib" id="ms" aria-label="Measure">📏</button><button class="ib" id="fs" aria-label="Fullscreen">⛶</button></div>
 <div id="hud"><div class="card" id="co">—</div><div class="card" id="zl"></div></div><div id="net" class="card">Online</div><div id="toast" class="card"></div>
 <section id="info" class="sheet"><h2><span id="it">Place</span><button class="ib" data-x>✕</button></h2><p id="ic" class="mu"></p><p id="ie"></p><p id="iw"></p><p id="ir"></p><div class="rw"><button class="btn" id="isv">★ Save</button><button class="btn" id="ish">Share</button><button class="btn pri" id="idr">Route</button></div></section>
 <section id="lp" class="sheet"><h2>Map &amp; tools<button class="ib" data-x>✕</button></h2><div class="lay" id="lg"></div><div id="tl"></div></section>
 <section id="sp" class="sheet"><h2>Settings<button class="ib" data-x>✕</button></h2><div id="sb"></div></section>
 <section id="mt" class="card" hidden><b id="mv"></b><span class="rw"><button class="btn" id="mmode">Area</button><button class="btn" id="mun">Undo</button><button class="btn" id="mcl">Clear</button></span></section>
 <div id="vo" hidden><div class="mic">🎤</div><p id="vs">Listening…</p><div id="vc"></div><button class="btn" id="vx">Cancel</button></div>
 <div id="md" hidden><div class="card"><div id="mb"></div><button class="btn pri" id="mx">Close</button></div></div>
</div>
<script src="config.js"></script><script src="app.js" defer></script></body></html>
